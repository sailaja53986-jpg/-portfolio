<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#4facfe,#00f2fe);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:white;
      border-radius:15px;
      padding:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
      color:#444;
    }

    .input-box input,
    .input-box select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .input-box input:focus,
    .input-box select:focus{
      border-color:#4facfe;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:17px;
      cursor:pointer;
    }

    button:hover{
      background:#00c6fb;
    }

    .toggle-text{
      text-align:center;
      margin-top:15px;
    }

    .toggle-text a{
      color:#4facfe;
      font-weight:bold;
      text-decoration:none;
      cursor:pointer;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      font-size:14px;
    }

    table th{
      background:#4facfe;
      color:white;
      padding:10px;
    }

    table td{
      padding:10px;
      border-bottom:1px solid #ddd;
      text-align:center;
    }

    table tr:hover{
      background:#f1f1f1;
    }

    #studentPage{
      display:none;
    }

  </style>

</head>
<body>

  <!-- LOGIN / SIGNUP PAGE -->
  <div class="container" id="authPage">

    <h2 id="title">Sign Up</h2>

    <!-- Signup Form -->
    <div id="signupForm">

      <div class="input-box">
        <label>Name</label>
        <input type="text" id="signupName" placeholder="Enter name">
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter email">
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Enter password">
      </div>

      <button onclick="signup()">Create Account</button>

      <div class="toggle-text">
        Already have an account?
        <a onclick="showLogin()">Sign In</a>
      </div>

    </div>

    <!-- Login Form -->
    <div id="loginForm" style="display:none;">

      <div class="input-box">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter email">
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>

      <button onclick="login()">Login</button>

      <div class="toggle-text">
        Don't have an account?
        <a onclick="showSignup()">Create Account</a>
      </div>

    </div>

    <div id="message"></div>

  </div>

  <!-- STUDENT DETAILS PAGE -->
  <div class="container" id="studentPage">

    <h2>Student Details</h2>

    <div class="input-box">
      <label>Student Name</label>
      <input type="text" id="studentName" placeholder="Enter student name">
    </div>

    <div class="input-box">
      <label>Roll Number</label>
      <input type="text" id="rollNumber" placeholder="Enter roll number">
    </div>

    <div class="input-box">
      <label>Branch</label>
      <select id="branch">
        <option value="">Select Branch</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
        <option>CIVIL</option>
      </select>
    </div>

    <div class="input-box">
      <label>Year</label>
      <select id="year">
        <option value="">Select Year</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>
    </div>

    <button onclick="addStudent()">Add Student</button>

    <table>

      <thead>
        <tr>
          <th>S.No</th>
          <th>Name</th>
          <th>Roll</th>
          <th>Branch</th>
          <th>Year</th>
        </tr>
      </thead>

      <tbody id="studentTable">

      </tbody>

    </table>

  </div>

  <script>

    let users = [];
    let count = 1;

    // Show Login
    function showLogin(){

      document.getElementById("signupForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("title").innerHTML = "Login";
      document.getElementById("message").innerHTML = "";

    }

    // Show Signup
    function showSignup(){

      document.getElementById("signupForm").style.display = "block";
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("title").innerHTML = "Sign Up";
      document.getElementById("message").innerHTML = "";

    }

    // Signup Function
    function signup(){

      let name = document.getElementById("signupName").value;
      let email = document.getElementById("signupEmail").value;
      let password = document.getElementById("signupPassword").value;

      if(name==="" || email==="" || password===""){
        alert("Please fill all fields");
        return;
      }

      users.push({
        name:name,
        email:email,
        password:password
      });

      document.getElementById("message").innerHTML =
        "Account Created Successfully!";

      document.getElementById("message").style.color = "green";

      // Clear fields
      document.getElementById("signupName").value = "";
      document.getElementById("signupEmail").value = "";
      document.getElementById("signupPassword").value = "";

      showLogin();

    }

    // Login Function
    function login(){

      let email = document.getElementById("loginEmail").value;
      let password = document.getElementById("loginPassword").value;

      let userFound = users.find(user =>
        user.email === email &&
        user.password === password
      );

      if(userFound){

        // Hide auth page
        document.getElementById("authPage").style.display = "none";

        // Show student page
        document.getElementById("studentPage").style.display = "block";

      } else {

        document.getElementById("message").innerHTML =
          "Invalid Email or Password";

        document.getElementById("message").style.color = "red";
      }

    }

    // Add Student
    function addStudent(){

      let name = document.getElementById("studentName").value;
      let roll = document.getElementById("rollNumber").value;
      let branch = document.getElementById("branch").value;
      let year = document.getElementById("year").value;

      if(name==="" || roll==="" || branch==="" || year===""){
        alert("Please fill all student details");
        return;
      }

      let table = document.getElementById("studentTable");

      let row = `
        <tr>
          <td>${count}</td>
          <td>${name}</td>
          <td>${roll}</td>
          <td>${branch}</td>
          <td>${year}</td>
        </tr>
      `;

      table.innerHTML += row;

      count++;

      // Clear fields
      document.getElementById("studentName").value = "";
      document.getElementById("rollNumber").value = "";
      document.getElementById("branch").value = "";
      document.getElementById("year").value = "";

    }

  </script>

</body>
</html>
