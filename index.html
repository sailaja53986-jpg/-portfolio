<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Student Portal</title>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(135deg,#4facfe,#00f2fe);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:15px;
    }

    .container{
      width:100%;
      max-width:400px;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box label{
      display:block;
      margin-bottom:5px;
      font-weight:bold;
      color:#444;
    }

    .input-box input,
    .input-box select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:17px;
      cursor:pointer;
      margin-top:10px;
    }

    button:hover{
      background:#00c6fb;
    }

    .toggle{
      text-align:center;
      margin-top:15px;
    }

    .toggle a{
      color:#4facfe;
      font-weight:bold;
      cursor:pointer;
      text-decoration:none;
    }

    #message{
      text-align:center;
      margin-top:15px;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      font-size:14px;
    }

    table th{
      background:#4facfe;
      color:white;
      padding:10px;
    }

    table td{
      padding:10px;
      border-bottom:1px solid #ddd;
      text-align:center;
    }

    #studentPage{
      display:none;
    }

  </style>

</head>
<body>

  <!-- LOGIN / SIGNUP PAGE -->

  <div class="container" id="authPage">

    <h2 id="title">Sign Up</h2>

    <!-- Signup Form -->

    <div id="signupForm">

      <div class="input-box">
        <label>Name</label>
        <input type="text"
               id="signupName"
               placeholder="Enter name">
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email"
               id="signupEmail"
               placeholder="Enter email">
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password"
               id="signupPassword"
               placeholder="Enter password">
      </div>

      <button onclick="signup()">
        Create Account
      </button>

      <div class="toggle">
        Already have an account?
        <a onclick="showLogin()">Sign In</a>
      </div>

    </div>

    <!-- Login Form -->

    <div id="loginForm" style="display:none;">

      <div class="input-box">
        <label>Email</label>
        <input type="email"
               id="loginEmail"
               placeholder="Enter email">
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password"
               id="loginPassword"
               placeholder="Enter password">
      </div>

      <button onclick="login()">
        Login
      </button>

      <div class="toggle">
        Don't have an account?
        <a onclick="showSignup()">Create Account</a>
      </div>

    </div>

    <div id="message"></div>

  </div>

  <!-- STUDENT DETAILS PAGE -->

  <div class="container" id="studentPage">

    <h2>Student Details</h2>

    <div class="input-box">
      <label>Student Name</label>
      <input type="text"
             id="studentName"
             placeholder="Enter student name">
    </div>

    <div class="input-box">
      <label>Roll Number</label>
      <input type="text"
             id="rollNumber"
             placeholder="Enter roll number">
    </div>

    <div class="input-box">
      <label>Branch</label>

      <select id="branch">
        <option value="">Select Branch</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>MECH</option>
        <option>CIVIL</option>
      </select>

    </div>

    <div class="input-box">
      <label>Year</label>

      <select id="year">
        <option value="">Select Year</option>
        <option>1st Year</option>
        <option>2nd Year</option>
        <option>3rd Year</option>
        <option>4th Year</option>
      </select>

    </div>

    <button onclick="addStudent()">
      Add Student
    </button>

    <table>

      <thead>
        <tr>
          <th>Name</th>
          <th>Roll</th>
          <th>Branch</th>
          <th>Year</th>
        </tr>
      </thead>

      <tbody id="studentTable">

      </tbody>

    </table>

  </div>

  <script>

    // ====================================
    // SUPABASE URL & ANON KEY
    // ====================================

    const SUPABASE_URL =
      "https://ipudyahkijaofyuhzdtv.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_sEOEdQLjc99aRtQPVEPDTQ_PczbVtB3";

    // ====================================

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    // Show Login

    function showLogin(){

      document.getElementById("signupForm")
        .style.display = "none";

      document.getElementById("loginForm")
        .style.display = "block";

      document.getElementById("title")
        .innerHTML = "Login";

      document.getElementById("message")
        .innerHTML = "";

    }

    // Show Signup

    function showSignup(){

      document.getElementById("signupForm")
        .style.display = "block";

      document.getElementById("loginForm")
        .style.display = "none";

      document.getElementById("title")
        .innerHTML = "Sign Up";

      document.getElementById("message")
        .innerHTML = "";

    }

    // SIGNUP

    async function signup(){

      const name =
        document.getElementById("signupName").value;

      const email =
        document.getElementById("signupEmail").value;

      const password =
        document.getElementById("signupPassword").value;

      if(name==="" || email==="" || password===""){
        alert("Please fill all fields");
        return;
      }

      const { data, error } = await client
        .from("users")
        .insert([
          {
            name:name,
            email:email,
            password:password
          }
        ]);

      if(error){

        document.getElementById("message")
          .innerHTML = error.message;

        document.getElementById("message")
          .style.color = "red";

      }else{

        document.getElementById("message")
          .innerHTML =
          "Account Created Successfully!";

        document.getElementById("message")
          .style.color = "green";

        showLogin();

      }

    }

    // LOGIN

    async function login(){

      const email =
        document.getElementById("loginEmail").value;

      const password =
        document.getElementById("loginPassword").value;

      const { data, error } = await client
        .from("users")
        .select("*")
        .eq("email", email)
        .eq("password", password);

      if(data.length > 0){

        document.getElementById("authPage")
          .style.display = "none";

        document.getElementById("studentPage")
          .style.display = "block";

        loadStudents();

      }else{

        document.getElementById("message")
          .innerHTML =
          "Invalid Email or Password";

        document.getElementById("message")
          .style.color = "red";

      }

    }

    // ADD STUDENT

    async function addStudent(){

      const studentName =
        document.getElementById("studentName").value;

      const rollNumber =
        document.getElementById("rollNumber").value;

      const branch =
        document.getElementById("branch").value;

      const year =
        document.getElementById("year").value;

      if(
        studentName === "" ||
        rollNumber === "" ||
        branch === "" ||
        year === ""
      ){
        alert("Please fill all fields");
        return;
      }

      const { data, error } = await client
        .from("students")
        .insert([
          {
            student_name:studentName,
            roll_number:rollNumber,
            branch:branch,
            year:year
          }
        ]);

      if(error){

        alert(error.message);

      }else{

        alert("Student Added");

        loadStudents();

        document.getElementById("studentName").value="";
        document.getElementById("rollNumber").value="";
        document.getElementById("branch").value="";
        document.getElementById("year").value="";

      }

    }

    // LOAD STUDENTS

    async function loadStudents(){

      const { data, error } = await client
        .from("students")
        .select("*");

      let table =
        document.getElementById("studentTable");

      table.innerHTML = "";

      data.forEach(student => {

        table.innerHTML += `
          <tr>
            <td>${student.student_name}</td>
            <td>${student.roll_number}</td>
            <td>${student.branch}</td>
            <td>${student.year}</td>
          </tr>
        `;

      });

    }

  </script>

</body>
</html>
